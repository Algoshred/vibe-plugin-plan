pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,js,json,md}"
      run: bun fmt --check {staged_files}
    lint:
      glob: "src/**/*.ts"
      run: bunx eslint {staged_files}
    typecheck:
      glob: "src/**/*.ts"
      run: bun run type:check

